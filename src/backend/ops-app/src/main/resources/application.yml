server:
  port: 8080

spring:
  application:
    name: iot-ops

  datasource:
    url: jdbc:postgresql://localhost:15432/iot_ops?sslmode=disable
    username: iotops
    password: ${DB_PASSWORD:iotops123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 16379
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

iot:
  mqtt:
    broker: tcp://localhost:11883
    client-id: ops-backend
    topic-prefix: iot/ops

  ai:
    base-url: https://api-inference.modelscope.cn/v1
    model: deepseek-ai/DeepSeek-V3.2
    api-key: ${MS_KEY:}

app:
  jwt:
    secret: ${JWT_SECRET:iot-ops-jwt-secret-key-2026-must-be-32-chars-long}

logging:
  level:
    com.iot.ops: DEBUG
    org.springframework.security: INFO
